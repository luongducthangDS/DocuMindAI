name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --no-cov

  # Retrieval-only eval against the production vector store (Qdrant Cloud) — FPT embedding,
  # collection documind_legal_fpt. Reranker TẮT như production (chưa chứng minh được lợi ích; bật
  # lại trong CI thì 199 lời gọi /v1/rerank dồn dập dính 429 — cần giới hạn tốc độ trước).
  # No LLM calls.
  # Fails the PR if recall/MRR drops beyond eval/ci_gate.py tolerances vs the
  # committed baseline.
  eval:
    runs-on: ubuntu-latest
    needs: test
    # Fork PRs get no secrets — skip instead of failing red for reasons unrelated to the diff.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      FPT_API_KEY: ${{ secrets.FPT_API_KEY }}
      VECTOR_STORE_PROVIDER: qdrant
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      ENABLE_RERANKER: "false"
      EMBEDDING_MODEL: Vietnamese_Embedding
      QDRANT_COLLECTION: documind_legal_fpt
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      # Gold questions rarely change → their embeddings neither. Keeps each run off the
      # FPT embedding endpoint (rate-limited, key shared with production).
      - uses: actions/cache@v4
        with:
          path: reports/_eval_cache/query_embeddings.json
          key: qemb-Vietnamese_Embedding-${{ hashFiles('data/eval/legal_qa_200.json') }}
          restore-keys: qemb-Vietnamese_Embedding-

      - name: Gold set still answerable from the index
        run: python eval/validate_gold.py data/eval/legal_qa_200.json

      - name: Retrieval eval
        run: >
          python eval/temporal_eval.py --gold data/eval/legal_qa_200.json
          --retrieval-only --arms pre_filter
          --embed-cache reports/_eval_cache/query_embeddings.json
          --output reports/ci_eval.json --mlflow "ci-${{ github.sha }}"

      - name: Gate vs baseline
        run: python eval/ci_gate.py reports/ci_eval.json --baseline reports/eval_baseline.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ github.sha }}
          path: |
            reports/ci_eval.json
            mlflow.db
            mlruns/
