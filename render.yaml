# Render Blueprint — DocuMind AI backend (FastAPI + ChromaDB local, Docker).
# Dùng: Render dashboard → New → Blueprint → point vào repo này.
# Dùng chung Dockerfile hiện có (multi-stage, build sẵn React vào /app/dist) — một
# service phục vụ cả UI lẫn API cùng domain, không cần CORS cho UI của chính nó.
#
# LƯU Ý QUAN TRỌNG: Render free/starter web service có disk ephemeral — tài liệu
# người dùng upload qua /api/v1/upload sẽ MẤT khi service restart/redeploy vì
# ChromaDB ghi vào ./data (không persist). Corpus gốc (91 chunks, baked vào image
# lúc build) thì không sao vì nó nằm trong image, không phải ở data volume.
# Muốn upload bền vững -> cần persistent disk (Render add-on trả phí) hoặc
# migrate sang Qdrant Cloud (xem task migration riêng).

services:
  - type: web
    name: documind-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      # LLM chính: FPT AI Marketplace; rỗng = chỉ Gemini. Service tạo tay nên phải
      # điền ở dashboard Render, file này không tự áp.
      - key: FPT_API_KEY
        sync: false
      - key: FPT_MODELS
        value: Qwen3.8-27B,DeepSeek-V4-Flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY_2
        sync: false
      - key: GOOGLE_API_KEY_3
        sync: false
      - key: API_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Phải khớp model đã tạo vector trên Qdrant. Qdrant vẫn là gemini-embedding-001
      # (đo 2026-10-17); check lúc mở collection chỉ so số chiều — 001 và 2 đều 3072 —
      # nên đổi sang 2 trước khi migrate Qdrant = tìm kiếm rác, không có lỗi nào báo.
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: INITIALIZE_RAG_ON_STARTUP
        value: "true"
      # Free tier = 512MB RAM. Reranker mặc định (BAAI/bge-reranker-v2-m3) nặng
      # ~2.2GB — bắt buộc phải tắt trên free tier; bật lại nếu nâng plan có nhiều RAM hơn.
      - key: ENABLE_RERANKER
        value: "false"
      # Embedding đi qua Gemini Embedding API nên không model nào nạp vào RAM;
      # dùng chung GOOGLE_API_KEY với phần generation, không cần HF_TOKEN.
      # Theo gemini.md: Default Model la gemini-3.8-flash, Lightweight la gemini-3.5-flash-lite.
      - key: GEMINI_GENERATION_MODELS
        value: gemini-3.8-flash,gemini-3.5-flash-lite
      # Corpus nằm ở Qdrant Cloud (migrate 2026-09-19: 1149 chunks, 3072-dim,
      # verify top-1 khớp ChromaDB nguồn). Disk Render ephemeral nên ChromaDB local
      # trong container luôn rỗng — đừng quay lại provider chroma ở production.
      # QDRANT_URL/QDRANT_API_KEY sync:false => điền tay ở dashboard.
      - key: VECTOR_STORE_PROVIDER
        value: qdrant
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Langfuse — log input/output/từng bước (router, retrieve, grade, generation
      # kèm model+token+cost) của MỌI query thật vào Render, gửi ra ngoài qua
      # OTLP/HTTP (xem src/langfuse_otel.py) nên KHÔNG phụ thuộc disk ephemeral —
      # trace sống trên Langfuse Cloud dù container restart/ngủ/redeploy.
      # Rỗng => tắt câm lặng, không lỗi gì (đúng thiết kế). Điền tay 2 key ở dashboard.
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://jp.cloud.langfuse.com
