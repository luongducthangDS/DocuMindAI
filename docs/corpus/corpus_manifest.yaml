# LƯU Ý CHUNG (đọc trước khi ingest):
#   - Không truy cập được "Lược đồ / Văn bản liên quan" trên vbpl.vn (SPA, không fetch được).
#     MỌI quan hệ sua_doi_boi / thay_the / bi_thay_the_boi dưới đây phải đối chiếu lại
#     với lược đồ chính thức trên vbpl.vn trước khi đưa vào metadata.
#   - Cho tính năng point-in-time đầy đủ: cần bản VĂN BẢN HỢP NHẤT (VBHN) của mỗi luật/nghị định
#     bị sửa nhiều lần, để lấy nội dung điều/khoản theo từng mốc. Nguồn VBHN: vbpl.vn hoặc bộ chủ quản.

