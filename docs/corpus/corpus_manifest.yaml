# QUY ƯỚC verify_status:
#   VERIFIED   = số hiệu + ngày ban hành + ngày hiệu lực đã đối chiếu >=2 nguồn (ưu tiên chinhphu.vn / congbao.chinhphu.vn)
#   PARTIAL    = số hiệu + tên đúng, nhưng >=1 mốc ngày hoặc quan hệ sửa đổi lấy từ nguồn thứ cấp, CHƯA đối chiếu Công báo
#   UNVERIFIED = chưa xác minh được văn bản này tồn tại đúng số hiệu / chưa tra được mốc ngày — KHÔNG nạp cho tới khi xác minh
